# ============================================================
# Reasoning on a Manifold — Experiment Configuration
# ============================================================
# Central question: do individual reasoning behaviours (backtracking,
# uncertainty, example-testing, knowledge augmentation) each occupy their
# own low-dimensional manifold in the residual stream?

project:
  seed: 42

# ── Models ────────────────────────────────────────────────
models:
  primary:
    id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    short_name: "R1-1.5B"
    cli_alias: "1.5b"            # --model value used by 02/04/07
    n_layers: 28
    hidden_dim: 1536
    dtype: "float16"
    use_4bit: false
    # Layer Huang et al. use for Qwen-1.5B / Qwen-7B
    steering_layer: 27

  secondary:
    id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    short_name: "R1-7B"
    cli_alias: "7b"
    n_layers: 28
    hidden_dim: 3584
    dtype: "float16"
    use_4bit: false
    steering_layer: 27

  # Non-thinking baseline for Extension 1 (companion document Section 3).
  # Identity verified empirically: embedding cos sim 0.994 vs R1-Distill-Qwen-1.5B
  # (vs 0.84 for the Instruct variant). See results/base_model_verification/.
  baseline:
    id: "Qwen/Qwen2.5-Math-1.5B"
    short_name: "QwenMath-1.5B"   # matches the short-name the runners pass via --model
    cli_alias: "qwen-math-1.5b"
    n_layers: 28
    hidden_dim: 1536
    dtype: "float16"
    use_4bit: false
    steering_layer: 27          # matches R1-1.5B for direct comparability
    is_thinking: false          # no <think>...</think> template; differential behaviour fractions are part of the finding

  # ── Post-training spillover extension (safety chapter, Rung 0) ──────────
  # Safety-post-trained twin of the primary model: STAR-1 deliberative-safety
  # SFT (1K examples, arXiv:2504.01903) applied to the EXACT thesis model.
  # Only delta vs primary = one isolated safety SFT step, so a geometry diff
  # on the same annotated generic-reasoning chains reads as safety-post-
  # training spillover (post_training_spillover_extension.md, Route C).
  safety_post:
    id: "UCSC-VLAA/STAR1-R1-Distill-1.5B"
    short_name: "STAR1-1.5B"
    cli_alias: "star1-1.5b"
    n_layers: 28
    hidden_dim: 1536
    dtype: "float16"
    use_4bit: false
    steering_layer: 27          # matches R1-1.5B for direct comparability

  tertiary:
    id: "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"
    short_name: "R1-8B"
    cli_alias: "8b"
    n_layers: 32
    hidden_dim: 4096
    dtype: "float16"
    use_4bit: false
    steering_layer: 31

  # ── Safety-reasoning extension: OpenAI gpt-oss-20b ──────────────────────
  # Deliberative-alignment testbed (see ../safety_reasoning_extension.md).
  # MoE (top-4/32 of 32 experts); CoT lives in the harmony `analysis` channel,
  # NOT a <think> block; reasoning effort is configurable (low/medium/high).
  # Residual stream is extractable via output_hidden_states — MXFP4 quantises
  # WEIGHTS ONLY, so activations are bf16. ~48 GB in bf16 on the DGX Spark
  # (non-Hopper) vs ~16 GB on Hopper-MXFP4. ANALYSE THE RESIDUAL STREAM ONLY:
  # the top-4/32 MoE routing makes MLP-output directions vary token-to-token.
  safety_gpt_oss:
    id: "openai/gpt-oss-20b"
    short_name: "gpt-oss-20b"
    cli_alias: "gpt-oss-20b"
    n_layers: 24
    hidden_dim: 2880
    dtype: "bfloat16"            # MXFP4 weights dequantise to bf16 off-Hopper
    use_4bit: false
    family: "gpt_oss"
    reasoning_format: "harmony"
    reasoning_effort: "high"
    requires_transformers: ">=4.55.1"
    # Late-layer Huang analogue (~0.96 depth -> 23/24). CONFIRM via attribution
    # patching on the Spark before locking; Venhoff mid-layer analogue ~= 15.
    steering_layer: 23

# ── Phase 1: Task generation ──────────────────────────────
tasks:
  n_per_category: 100          # 1000 tasks total across 10 categories
  batch_size: 25               # Tasks per GPT-4o call
  generation_model: "gpt-4o"
  categories:
    - "mathematical_logic"
    - "spatial_reasoning"
    - "verbal_logic"
    - "pattern_recognition"
    - "lateral_thinking"
    - "causal_reasoning"
    - "probabilistic_thinking"
    - "systems_thinking"
    - "creative_problem_solving"
    - "scientific_reasoning"

# ── Phase 2: Chain generation ─────────────────────────────
chains:
  max_new_tokens: 8192         # Pilot revealed 4096 still truncates open-ended creative tasks
  temperature: 0.0             # Greedy decoding (Venhoff protocol)
  checkpoint_every: 50

# ── Phase 3: Annotation ───────────────────────────────────
annotation:
  # Claude Sonnet 4.5 (primary) via the AWS Bedrock / Claude proxy — NOT GPT-4o.
  # Venhoff used GPT-4o, but it is unavailable on this proxy (deviation noted in
  # the methods section). The annotator-robustness arm re-annotates the same
  # chains with two further proxy models — Qwen3-235B and Nova-Pro — for a 3-way
  # agreement check (see run_multiannotator_pipeline.sh).
  model: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
  provider: "anthropic_aws_proxy"
  prompt_source: "venhoff_2025_appendix_a"  # verbatim, hyphenated labels
  temperature: 0.0
  # Six behaviours from Venhoff et al. taxonomy (arXiv:2506.18167)
  # Label names are hyphenated lowercase exactly as in Appendix A
  labels:
    - backtracking
    - uncertainty-estimation
    - example-testing
    - adding-knowledge
    - initializing
    - deduction
  # The four we care about (distinct to thinking models)
  target_behaviours:
    - backtracking
    - uncertainty-estimation
    - example-testing
    - adding-knowledge
  min_instances_for_pca: 100   # Minimum per behaviour per layer

# ── Phase 4: Activation extraction ───────────────────────
extraction:
  n_preceding_tokens: 1        # Token just before behaviour onset
  n_execution_tokens: 10       # First N tokens of the behaviour
  pooling: "mean"              # Span pooling: mean | last | first | max (see src/activation_extraction._pool)
  # Auto pooling-sweep: if set (e.g. [mean, last, first]), EVERY extraction pools
  # all listed modes from the same forward pass (≈zero extra GPU) and writes a
  # pooling_sweep.json comparison (cos of steering direction + d_eff per mode).
  # Leave null to disable. This is the "automatic sweep on re-extract" switch.
  pooling_sweep: [mean, last]  # ARMED: every (re)extraction also pools 'last' and
                               # writes pooling_sweep.json (mean-vs-last). ~2x activation
                               # disk (mean + last). Set null to disable; add first/max to extend.
  layers: null                 # null = all layers; or list e.g. [20,21,...,27]
  clip_window_to_sentence_end: false  # true = execution tokens stop at the sentence
                               # end (15.8% of target sentences are shorter than the
                               # 1+10 window, so the unclipped window pools the NEXT
                               # sentence's onset — robustness arm; default false to
                               # stay comparable with existing extractions)

# ── Phase 5: PCA analysis ─────────────────────────────────
pca:
  max_components: 50
  variance_thresholds: [0.50, 0.70, 0.80, 0.90, 0.95]

# ── Phase 6: Steering vectors ─────────────────────────────
steering:
  # k values to try for manifold projection (top-k PCA components)
  k_values: [1, 3, 5, 10, "auto"]   # "auto" = k for 70% variance
  mode: "subtract"                   # reduce the behaviour

# ── Analysis: per-behaviour peak (PR-trough) layers ───────
# Smoothed participation-ratio trough (argmin PR = most concentrated low-dim
# manifold) from the 2026-06-18 triangulation re-run, field `pr_peak` in
# results/triangulation/R1-1.5B/candidate_layers.json.
# RECONCILED 2026-06-20: the previous values (backtracking/uncertainty 14,
# adding-knowledge 17, example-testing 27) were STALE — they did not match the
# current triangulation output the comment claimed to derive from.
#
# ⚠️ PR-trough = manifold CONCENTRATION, not behaviour-SPECIFICITY. Per the
# chain-stratified variance-ratio null (results/pca/R1-1.5B/null_pvalues_per_layer.json):
#   - backtracking, uncertainty-estimation: specific at ALL layers.
#   - example-testing: specific ONLY at L27; its PR-trough (L12) is NOT specific.
#   - adding-knowledge: NOT specific at any tested layer — its peak is descriptive only.
# The canonical 06_build_steering.py steers every behaviour at L27 (Huang-aligned);
# these per-behaviour layers drive ONLY build_phase6.py (the `-peak` vectors) and
# 05d sub-type clustering. Both on-disk artefacts were built at the OLD layers and
# are now stale vs this field — rebuild before relying on them. For steering,
# consider overriding example-testing back to 27 (specific + Huang + canonical).
analysis:
  peak_layers:
    backtracking: 16
    uncertainty-estimation: 16
    adding-knowledge: 16
    example-testing: 12

# ── Phase 7: Evaluation ───────────────────────────────────
evaluation:
  alpha_values: [0.0, 0.3, 0.5, 0.7, 1.0, 1.5, 2.0, 3.0]
  n_test_tasks: 50
  # Re-annotation of steered outputs reuses the Phase-3 annotator via the Claude
  # proxy (NOT gpt-4o — that string was a stale, unused plan value). 07/eval read
  # the proxy env (CLAUDE_PROXY_URL/KEY), not this key; kept for documentation.
  annotation_model: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"  # matches annotation.model
  benchmarks:
    - name: "gsm8k"
      dataset_id: "openai/gsm8k"
      split: "test"

# ── Paths ─────────────────────────────────────────────────
paths:
  tasks: "data/tasks.json"
  chains: "data/chains_{model}.json"
  annotated: "data/annotated_{model}.json"
  activations: "data/activations/{model}"
  pca_results: "results/pca/{model}"
  steering_vectors: "results/steering_vectors/{model}"
  eval_results: "results/eval/{model}"
  figures: "results/figures"
